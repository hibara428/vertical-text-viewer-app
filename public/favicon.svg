  16px でも潰れないよう、余白を詰めて線を太らせてある。片方を描き直すときはもう片方も。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
    <rect x="2" y="2" width="20" height="20" rx="3" />
    <path d="M17.25 6v10.75M12.5 6v12M7.75 6v6" />
    <style>
        rect, path { stroke: #1a1a1a; }
        @media (prefers-color-scheme: dark) {
            rect, path { stroke: #f5f5f5; }
        }
    </style>
</svg>
